<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1260" viewBox="0 0 1200 1260" role="img" aria-labelledby="title desc">
  <title id="title">NeoBank ARIA — one-page architecture</title>
  <desc id="desc">Chat selects guarded or unguarded operation. Both modes use the same ARIA assistant. Guarded mode screens input and recent conversation, restricts account and policy access, and screens the drafted reply. The assistant connects to local read-only account and policy tools and to the external OpenAI API. A separate testing lab runs 43 attacks and 10 benign cases in both modes, scores every turn, saves evidence, and creates findings reports.</desc>
  <defs>
    <marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#3478DB"/></marker>
    <marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#D77822"/></marker>
    <marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#17916D"/></marker>
    <marker id="purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8561C9"/></marker>
    <marker id="slate" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#91A2BA"/></marker>
    <marker id="rose" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#C16F86"/></marker>
    <style>
      text {font-family:Arial,Helvetica,sans-serif;fill:#21324B}
      .section {font-size:18px;font-weight:700;letter-spacing:2px}
      .heading {font-size:30px;font-weight:700}
      .body {font-size:22px}
      .small {font-size:20px}
      .muted {fill:#596D88}
      .green {fill:#117C5E}
      .orange {fill:#A95812}
      .purple {fill:#6745A4}
      .blue {fill:#245FA8}
      .line {fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:3}
    </style>
  </defs>
  <rect width="1200" height="1260" fill="#F5F8FD"/>
  <rect x="0" y="0" width="1200" height="9" fill="#6745A4"/>

  <text x="40" y="76" font-size="48" font-weight="700">NeoBank <tspan fill="#7450B4">ARIA</tspan></text>
  <text x="40" y="115" font-size="24" class="muted">A banking assistant, layered safeguards, and a red-team testing lab</text>
  <circle cx="48" cy="154" r="7" fill="#17916D"/><text x="66" y="161" class="small green">Guarded path</text>
  <circle cx="262" cy="154" r="7" fill="#D77822"/><text x="280" y="161" class="small orange">Unguarded path</text>
  <circle cx="507" cy="154" r="7" fill="#8561C9"/><text x="525" y="161" class="small purple">Shared assistant</text>

  <text x="40" y="214" class="section blue">1  START A CHAT</text>
  <text x="300" y="214" class="section">2  CHOOSE A MODE</text>
  <text x="600" y="214" class="section purple">3  GENERATE</text>
  <text x="910" y="214" class="section blue">4  RESPOND</text>

  <!-- A single question travels left to right. -->
  <path d="M260 315H294" class="line" stroke="#D77822" marker-end="url(#orange)"/>
  <path d="M260 455H294" class="line" stroke="#17916D" marker-end="url(#green)"/>
  <path d="M550 315H594" class="line" stroke="#D77822" marker-end="url(#orange)"/>
  <path d="M550 455H594" class="line" stroke="#17916D" marker-end="url(#green)"/>
  <path d="M860 410H904" class="line" stroke="#8561C9" marker-end="url(#purple)"/>

  <rect x="40" y="280" width="220" height="260" rx="20" fill="#E7F0FF" stroke="#C6DAF7"/>
  <rect x="60" y="305" width="55" height="7" rx="3.5" fill="#3478DB"/>
  <text x="60" y="357" class="heading blue">Chat</text>
  <text x="60" y="401" class="body"><tspan x="60">Select a demo</tspan><tspan x="60" dy="30">customer.</tspan><tspan x="60" dy="40">Ask a question.</tspan></text>
  <text x="60" y="513" class="small blue">Streamlit interface</text>

  <rect x="300" y="245" width="250" height="112" rx="20" fill="#FFF0DE" stroke="#F2CFA5"/>
  <text x="320" y="286" class="heading orange">Unguarded</text>
  <text x="320" y="327" class="body">Baseline instructions</text>

  <rect x="300" y="390" width="250" height="180" rx="20" fill="#E3F5ED" stroke="#ADDAC8"/>
  <text x="320" y="431" class="heading green">Guarded</text>
  <text x="320" y="471" class="body"><tspan x="320">Screen input</tspan><tspan x="320" dy="33">Check recent turns</tspan><tspan x="320" dy="33">Harden instructions</tspan></text>
  <text x="300" y="605" class="small green"><tspan x="300">Block or review?</tspan><tspan x="300" dy="27">Safe reply; skip ARIA.</tspan></text>

  <rect x="600" y="260" width="260" height="300" rx="20" fill="#EEE8FB" stroke="#D4C5ED"/>
  <rect x="620" y="285" width="55" height="7" rx="3.5" fill="#8561C9"/>
  <text x="620" y="334" class="heading purple">ARIA assistant</text>
  <text x="620" y="382" class="body"><tspan x="620">Plan the next step</tspan><tspan x="620" dy="35">Validate tool calls</tspan><tspan x="620" dy="35">Draft an answer</tspan></text>
  <path d="M620 476H840" stroke="#D4C5ED"/>
  <text x="620" y="510" class="small purple"><tspan x="620">LangChain runtime</tspan><tspan x="620" dy="28">At most 8 tool calls</tspan></text>

  <rect x="910" y="260" width="250" height="300" rx="20" fill="#E7F0FF" stroke="#C6DAF7"/>
  <rect x="930" y="285" width="55" height="7" rx="3.5" fill="#3478DB"/>
  <text x="930" y="334" class="heading blue">Reply</text>
  <text x="930" y="378" class="body orange" font-weight="700">Unguarded</text>
  <text x="930" y="408" class="body">Return directly</text>
  <path d="M930 429H1140" stroke="#C6DAF7"/>
  <text x="930" y="464" class="body green" font-weight="700">Guarded</text>
  <text x="930" y="496" class="body"><tspan x="930">Scan for leaks, then</tspan><tspan x="930" dy="30">reply or refuse</tspan></text>

  <!-- The assistant calls local tools and the external model service. -->
  <path d="M730 561V688M225 688H975M225 688V715M600 688V715M975 688V715" class="line" stroke="#91A2BA"/>
  <text x="751" y="606" class="small muted"><tspan x="751">Requests + results</tspan><tspan x="751" dy="27">Tools run only when needed</tspan></text>
  <text x="40" y="680" class="section muted">TOOLS &amp; MODEL</text>

  <rect x="40" y="720" width="355" height="235" rx="20" fill="#FFFFFF" stroke="#C6DAF7"/>
  <rect x="40" y="720" width="355" height="9" rx="4.5" fill="#3478DB"/>
  <text x="60" y="770" class="heading blue">Account lookup</text>
  <text x="60" y="806" class="body">SQLite · fictional accounts</text>
  <text x="60" y="853" class="body green" font-weight="700">Guarded</text>
  <text x="60" y="882" class="body">Your session account only</text>
  <text x="60" y="926" class="small orange">Unguarded: any account ID</text>

  <rect x="420" y="720" width="355" height="235" rx="20" fill="#FFFFFF" stroke="#ADDAC8"/>
  <rect x="420" y="720" width="355" height="9" rx="4.5" fill="#17916D"/>
  <text x="440" y="770" class="heading green">Policy lookup</text>
  <text x="440" y="806" class="body">Python policy dictionary</text>
  <text x="440" y="853" class="body green" font-weight="700">Guarded</text>
  <text x="440" y="882" class="body">Public policies, redacted</text>
  <text x="440" y="926" class="small orange">Unguarded: all policy topics</text>

  <rect x="800" y="720" width="360" height="235" rx="20" fill="#FFFFFF" stroke="#D4C5ED"/>
  <rect x="800" y="720" width="360" height="9" rx="4.5" fill="#8561C9"/>
  <text x="820" y="770" class="heading purple">OpenAI API</text>
  <text x="820" y="806" class="body">External model service</text>
  <text x="820" y="853" class="body"><tspan x="820">Planning + final answers</tspan><tspan x="820" dy="34">Optional input classifier</tspan><tspan x="820" dy="34">Optional security judge</tspan></text>

  <text x="40" y="1009" class="section" fill="#AF5069">TESTING LAB</text>
  <text x="228" y="1009" class="small muted">Exercises the same workflow in both modes</text>

  <path d="M287 1108H319" class="line" stroke="#C16F86" marker-end="url(#rose)"/>
  <path d="M578 1108H610" class="line" stroke="#C16F86" marker-end="url(#rose)"/>
  <path d="M869 1108H901" class="line" stroke="#C16F86" marker-end="url(#rose)"/>
  <rect x="40" y="1036" width="247" height="149" rx="18" fill="#FCECF1" stroke="#EDC9D4"/>
  <text x="58" y="1080" font-size="27" font-weight="700">53 test cases</text>
  <text x="58" y="1120" class="body"><tspan x="58">43 attacks</tspan><tspan x="58" dy="30">+ 10 benign cases</tspan></text>

  <rect x="331" y="1036" width="247" height="149" rx="18" fill="#FCECF1" stroke="#EDC9D4"/>
  <text x="349" y="1080" font-size="27" font-weight="700">Run both modes</text>
  <text x="349" y="1120" class="body"><tspan x="349">Capture every turn</tspan><tspan x="349" dy="30">and its traces</tspan></text>

  <rect x="622" y="1036" width="247" height="149" rx="18" fill="#FCECF1" stroke="#EDC9D4"/>
  <text x="640" y="1080" font-size="27" font-weight="700">Score + save</text>
  <text x="640" y="1118" class="small"><tspan x="640">Security · utility · errors</tspan><tspan x="640" dy="28">Judge status + JSONL</tspan></text>

  <rect x="913" y="1036" width="247" height="149" rx="18" fill="#FCECF1" stroke="#EDC9D4"/>
  <text x="931" y="1080" font-size="27" font-weight="700">Findings reports</text>
  <text x="931" y="1120" class="body"><tspan x="931">HTML + Markdown</tspan><tspan x="931" dy="30">Compare outcomes</tspan></text>

  <text x="40" y="1231" class="small muted">Demo identity · Read-only tools · “Review” displays a static message</text>
</svg>
